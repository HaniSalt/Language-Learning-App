version: '3.9'

services:
  user-service:
    build: ./services/user-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - FIREBASE_CREDENTIALS_PATH=/app/firebase-credentials.json

  deck-service:
    build: ./services/deck-service
    ports:
      - "8082:8082"
    environment:
      - ATLAS_URI=mongodb+srv://hanisalti23:Frozenboy123@cluster0.twthccf.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
      - PORT=8082

  card-service:
    build: ./services/card-service
    ports:
      - "8083:8083"
    environment:
      - ATLAS_URI=mongodb+srv://hanisalti23:Frozenboy123@cluster0.twthccf.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
      - PORT=8083

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - DECK_SERVICE_URL=http://deck-service:8082
      - CARD_SERVICE_URL=http://card-service:8083
      - PORT=8080
    depends_on:
      - user-service
      - deck-service
      - card-service